schema: spec-driven

context: |
  GigaChess is a high-performance, pure TypeScript, zero-runtime-dependency
  chess rules and move-generation library published as the MIT-licensed npm
  package "gigachess". It provides a stateful Board, chess.js and chessops
  compatibility adapters, Chess960, PGN, SAN/UCI, variation trees, Polyglot
  Zobrist hashing, and 16-bit moves2 binary replay.

  This is NOT the former PureChess desktop app: no Tauri, UI, keyboard or
  AGPL/GPL assumptions. Node.js >=22.5, ESM and modern browsers are supported.
  Do not add a WebAssembly runtime dependency; fast synchronous startup and
  normal interactive chess use are deliberate design goals.

  Peer repository: https://github.com/itshak/gigachess-rs (native Rust).
  The two engines MUST preserve identical chess semantics and binary contracts.
  See the live OpenSpec change dual-engine-hardening-20261123 and its mirrored
  `specs/mirrored-core-contract/spec.md` in BOTH repositories before changes
  to board rules, Chess960, castling, moves2, null moves, repetition or hashing.

rules:
  proposal:
    - Describe the impact on existing published users and semver compatibility
    - State whether the same rules or binary contract requires a Rust change
    - License must remain MIT and imported code must be independently reviewed
  specs:
    - Use Given/When/Then scenarios for chess correctness and public APIs
    - Preserve mirrored JS/Rust FEN, moves2, Polyglot and repetition semantics
    - Update identical cross-language fixtures in both repositories as needed
  design:
    - Include cold startup, warm latency, real-game and throughput measurements
    - Never conflate Polyglot hash semantics with FIDE repetition-equivalence
    - Do not integrate Rust or WebAssembly into the pure TypeScript package
  tasks:
    - Every rule change requires parity, perft, SAN/FEN and fuzz regression
    - Performance-only changes require reproducible before/after benchmarks
    - Coordinate changes that affect shared formats with gigachess-rs
operations:
  apply:
    guidance:
      - Prefix commit messages with the OpenSpec change ID
      - Run npm run typecheck, npm test and relevant benchmark suites locally
      - Avoid breaking published exports or trusted replay hot paths silently
  archive:
    guidance:
      - Record benchmark environment and consumer compatibility verification
      - Archive paired changes only when both language contracts are settled
