name: 🐛 Bug Report
description: Report an issue, incorrect move validation, or parsing bug.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: GigaChess Version
      placeholder: e.g. 0.2.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction Code / FEN / PGN
      description: Please provide code or a FEN string reproducing the issue.
      placeholder: |
        import { Chess } from 'gigachess';
        const game = new Chess('...');
        game.move('...');
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened (error stack trace, return value)?
    validations:
      required: true
