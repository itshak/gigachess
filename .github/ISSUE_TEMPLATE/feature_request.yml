name: 🚀 Feature Request
description: Suggest an idea or performance enhancement for TurboChess.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or limitation is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Additional Context / Alternatives
      description: Any alternative solutions, benchmark numbers, or API ideas you've considered.
