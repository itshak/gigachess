name: bench-real
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corpus:
    name: Prepare pinned 20k-position real-game corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci
      - run: node bench/matrix/prepare-corpus.mjs 20000 1000
      - uses: actions/upload-artifact@v4
        with:
          name: matrix-corpus
          path: |
            ci-benchmark/corpus.json
            ci-benchmark/corpus.sha256
          retention-days: 14
  competitive:
    name: Competitive (${{ matrix.runner }} / ${{ matrix.runtime }} / replicate ${{ matrix.replica }})
    needs: corpus
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm, macos-15, macos-15-intel]
        runtime: [node24, node22]
        replica: [1, 2]
        include:
          - {runner: ubuntu-24.04, runtime: bun, replica: 1}
          - {runner: ubuntu-24.04-arm, runtime: bun, replica: 1}
          - {runner: macos-15, runtime: bun, replica: 1}
          - {runner: macos-15-intel, runtime: bun, replica: 1}
          - {runner: windows-2025, runtime: bun, replica: 1}
          - {runner: ubuntu-24.04, runtime: deno, replica: 1}
          - {runner: ubuntu-24.04-arm, runtime: deno, replica: 1}
          - {runner: macos-15, runtime: deno, replica: 1}
          - {runner: windows-2025, runtime: deno, replica: 1}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.runtime == 'node22' && '22.5.0' || '24.19.0' }}
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
        with:
          bun-version: '1.4.0'
      - uses: denoland/setup-deno@v2
        if: matrix.runtime == 'deno'
        with:
          deno-version: '2.9.6'
      - uses: actions/download-artifact@v4
        with:
          name: matrix-corpus
          path: ci-benchmark
      - name: Build and pin competitors
        run: bash bench/matrix/setup.sh
      - name: Correctness checks
        run: |
          set -o pipefail
          (node tests/pawn-list-order.mjs && node tests/move-list-ownership.mjs && node tests/perft-specialized-parity.mjs && node tests/split32-exhaustive.mjs --cold && node tests/split32-exhaustive.mjs && node tests/perft-compact-differential.mjs && node tests/standard-movegen-differential.mjs) 2>&1 | tee benchmark-results/correctness.log
      - name: Exact published and source 4,000-position comparison
        if: startsWith(matrix.runtime, 'node')
        run: |
          set -o pipefail
          node --expose-gc --import ./ci-benchmark/tools/node_modules/tsx/dist/loader.mjs bench/bench-competitive-movegen-direct.mjs --baseline ci-benchmark/baseline/dist/fast/index.js --drumevp ci-benchmark/drumevp --published ci-benchmark/package/dist/index.js --warmups 12 --runs 25 | tee benchmark-results/direct-movegen.json
      - name: Long all-library matrix
        run: |
          set -o pipefail
          case "${{ matrix.runtime }}" in
            bun) bun bench/matrix/cli.mjs --runs 21 --warmups 12 --deep-runs 7 ;;
            deno) deno run -A --v8-flags=--expose-gc bench/matrix/cli.mjs --runs 21 --warmups 12 --deep-runs 7 ;;
            *) node --expose-gc bench/matrix/cli.mjs --runs 21 --warmups 12 --deep-runs 7 ;;
          esac 2>&1 | tee benchmark-results/matrix.log
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitive-${{ matrix.runner }}-${{ matrix.runtime }}-${{ matrix.replica }}
          path: benchmark-results/
          retention-days: 30
  official:
    name: Full real corpus (${{ matrix.runner }} / ${{ matrix.suite }})
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm, macos-15, macos-15-intel]
        suite: [sliding,perft,pgn-stream,fen-san-uci,dests-terminal,bundle,chessjs,workstation-real]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci
      - run: npm run build
      - name: Full suite without reduced-corpus fallback
        run: |
          mkdir -p benchmark-results
          node bench/matrix/machine.mjs
          set -o pipefail
          node --expose-gc --max-old-space-size=4096 bench/bench-real.mjs --suite "${{ matrix.suite }}" --json 2>&1 | tee benchmark-results/full.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-${{ matrix.runner }}-${{ matrix.suite }}
          path: benchmark-results/
          retention-days: 30
  browsers:
    name: Browser (${{ matrix.runner }} / ${{ matrix.browser }})
    needs: corpus
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@v4
        with:
          name: matrix-corpus
          path: ci-benchmark
      - run: bash bench/matrix/setup.sh
      - run: npm install --prefix ci-benchmark/tools --no-audit --no-fund playwright@1.65.1
      - name: Install exact browser engine
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            node ci-benchmark/tools/node_modules/playwright/cli.js install --with-deps "${{ matrix.browser }}"
          else
            node ci-benchmark/tools/node_modules/playwright/cli.js install "${{ matrix.browser }}"
          fi
      - run: |
          set -o pipefail
          node bench/matrix/browser-driver.mjs "${{ matrix.browser }}" 2>&1 | tee benchmark-results/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.runner }}-${{ matrix.browser }}
          path: benchmark-results/
          retention-days: 30
  large-pgn:
    name: Million-game streaming (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci && npm run build
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y zstd
          mkdir -p ci-benchmark benchmark-results
          node bench/matrix/machine.mjs
          curl --fail --location --retry 3 --output ci-benchmark/lichess-2015-01.pgn.zst https://database.lichess.org/standard/lichess_db_standard_rated_2015-01.pgn.zst
          echo "9061f9dc0ab0d8710886d1745b5ca83a27b61fe5e504f9dcd549218fa3598f57  ci-benchmark/lichess-2015-01.pgn.zst" | sha256sum -c -
          set -o pipefail
          node --expose-gc bench/matrix/large-pgn.mjs ci-benchmark/lichess-2015-01.pgn.zst 1000000 5 | tee benchmark-results/large-pgn.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: large-pgn-${{ matrix.runner }}
          path: benchmark-results/
          retention-days: 30
  summarize:
    name: Collect all benchmark results
    needs: [competitive, official, browsers, large-pgn]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: all-results
      - run: node bench/matrix/summarize.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: matrix-summary
          path: summary.md
          retention-days: 30
