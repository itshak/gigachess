name: bench-real
on:
  workflow_dispatch:
    inputs:
      target:
        description: Validation scope
        type: choice
        options: [all, earlysan-node22]
        default: all
permissions:
  contents: read
jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci
      - run: node bench/matrix/prepare-corpus.mjs 20000 1000
      - uses: actions/upload-artifact@v4
        with:
          name: phase22-corpus
          path: |
            ci-benchmark/corpus.json
            ci-benchmark/corpus.sha256
  diagnose:
    needs: corpus
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(inputs.target == 'earlysan-node22' && '[{"variant":"earlysan","runner":"ubuntu-24.04","node":"22.5.0"}]' || '[{"variant":"early","runner":"ubuntu-24.04","node":"24.19.0"},{"variant":"early","runner":"ubuntu-24.04-arm","node":"24.19.0"},{"variant":"early","runner":"windows-2025","node":"24.19.0"},{"variant":"early","runner":"windows-11-arm","node":"24.19.0"},{"variant":"earlysan","runner":"ubuntu-24.04","node":"24.19.0"},{"variant":"earlysan","runner":"ubuntu-24.04-arm","node":"24.19.0"},{"variant":"earlysan","runner":"windows-2025","node":"24.19.0"},{"variant":"earlysan","runner":"windows-11-arm","node":"24.19.0"},{"variant":"early","runner":"ubuntu-24.04","node":"22.5.0"},{"variant":"earlysan","runner":"ubuntu-24.04","node":"22.5.0"}]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: phase22-corpus
          path: ci-benchmark
      - name: Build isolated refinement and pinned references
        run: |
          git apply --check "bench/phase22/patches/${{ matrix.variant }}.patch"
          git apply "bench/phase22/patches/${{ matrix.variant }}.patch"
          bash bench/matrix/setup.sh
      - name: Full correctness and reproducible tables
        run: |
          set -euo pipefail
          npm run typecheck
          sha256sum node_modules/chessops/package.json node_modules/@itshak/chesstree/node_modules/chessops/package.json > benchmark-results/oracle-before.sha
          npm test 2>&1 | tee benchmark-results/correctness.log
          sha256sum -c benchmark-results/oracle-before.sha
          node tests/initial-template-ownership.mjs
          node bench/make-split32-tables.mjs
          git diff --exit-code -- src/rookSplit32Blob.ts src/bishopSplit32Blob.ts
      - name: Exact normalized UCI parity
        run: |
          set -o pipefail
          node bench/phase20/verify.mjs | tee benchmark-results/word-parity.json
      - name: Original direct comparison
        run: |
          set -o pipefail
          node --expose-gc --import ./ci-benchmark/tools/node_modules/tsx/dist/loader.mjs bench/bench-competitive-movegen-direct.mjs --baseline ci-benchmark/baseline/dist/fast/index.js --drumevp ci-benchmark/drumevp --published ci-benchmark/package/dist/index.js --warmups 12 --runs 25 | tee benchmark-results/direct-movegen.json
      - name: Isolated trace and initial-free controls
        run: node bench/phase21/run.mjs
      - name: Exact ordered SAN and UCI with longer paired samples
        run: |
          set -o pipefail
          SAN_POSITIONS=12000 node --expose-gc bench/phase22/san-compare.mjs ci-benchmark/corpus.json benchmark-results/san-compare.json ci-benchmark/baseline/dist/fast/index.js dist/fast/index.js | tee benchmark-results/san-compare.log
      - name: Paired real-game workloads
        run: |
          set -euo pipefail
          mkdir -p ci-benchmark/corpus ci-benchmark/candidate
          cp ci-benchmark/corpus.json ci-benchmark/corpus/
          cp bench/phase18/paired-long.mjs ci-benchmark/paired.mjs
          cp -R dist ci-benchmark/candidate/dist
          cd ci-benchmark
          export BENCH_POSITIONS=20000 BENCH_GAMES=300 BENCH_RUNS=15 BENCH_WARMUPS=8 BENCH_BATCHES=4 BENCH_OUT=../benchmark-results/paired
          node --expose-gc paired.mjs baseline candidate 2>&1 | tee ../benchmark-results/paired.log
      - name: All-library real-game comparison
        run: |
          set -o pipefail
          node --expose-gc bench/matrix/cli.mjs --no-deep --runs 9 --warmups 5 --games 300 2>&1 | tee benchmark-results/matrix.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase22-${{ matrix.variant }}-${{ matrix.runner }}-${{ matrix.node }}
          path: benchmark-results/
