name: bench-real
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci
      - run: node bench/matrix/prepare-corpus.mjs 20000 1000
      - uses: actions/upload-artifact@v4
        with:
          name: phase12-corpus
          path: |
            ci-benchmark/corpus.json
            ci-benchmark/corpus.sha256
  experiment:
    needs: corpus
    name: ${{ matrix.variant }} / ${{ matrix.runner }} / ${{ matrix.runtime }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        variant: [safehalf, targethalf, targetcontrol, targetucihalf]
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025, windows-11-arm, macos-15-intel]
        runtime: [node24]
        include:
          - {variant: safehalf, runner: macos-15, runtime: bun}
          - {variant: targethalf, runner: macos-15, runtime: bun}
          - {variant: targetcontrol, runner: macos-15, runtime: bun}
          - {variant: targetucihalf, runner: macos-15, runtime: bun}
          - {variant: safehalf, runner: ubuntu-24.04, runtime: node22}
          - {variant: targethalf, runner: ubuntu-24.04, runtime: node22}
          - {variant: targetucihalf, runner: ubuntu-24.04, runtime: node22}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.runtime == 'node22' && '22.5.0' || '24.19.0' }}
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
        with:
          bun-version: '1.4.0'
      - uses: actions/download-artifact@v4
        with:
          name: phase12-corpus
          path: ci-phase12/corpus
      - name: Build same-commit baseline and independent patch
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          node bench/matrix/machine.mjs
          git worktree add --detach ci-phase12/baseline 4fef578b5282eb64ab8d6193b429761333731149
          git worktree add --detach ci-phase12/candidate 4fef578b5282eb64ab8d6193b429761333731149
          git -C ci-phase12/candidate apply --check "../../bench/phase12/patches/${{ matrix.variant }}.patch"
          git -C ci-phase12/candidate apply "../../bench/phase12/patches/${{ matrix.variant }}.patch"
          (cd ci-phase12/baseline && npm ci && npm run build)
          (cd ci-phase12/candidate && npm ci && npm run build)
          cp bench/phase9/paired.mjs ci-phase12/paired.mjs
          cp bench/phase10/slider-paired.mjs ci-phase12/slider-paired.mjs
          cp bench/phase12/legality.mjs ci-phase12/legality.mjs
      - name: Correctness before timing
        run: |
          set -o pipefail
          cd ci-phase12/candidate
          (node tests/pawn-list-order.mjs && node tests/move-list-ownership.mjs && node tests/maintenance-regression.mjs && node tests/castling.mjs && node tests/zobrist-parity.mjs && node tests/perft-specialized-parity.mjs && node tests/perft-compact-differential.mjs && node tests/standard-movegen-differential.mjs && node tests/attacked-squares.mjs && node tests/split32-exhaustive.mjs && node tests/split32-exhaustive.mjs --cold) 2>&1 | tee ../../benchmark-results/correctness.log
      - name: Paired real-corpus measurements
        run: |
          set -o pipefail
          cd ci-phase12
          node --input-type=module -e 'import fs from "node:fs";import crypto from "node:crypto";const h=crypto.createHash("sha256").update(fs.readFileSync("corpus/corpus.json")).digest("hex");if(h!==fs.readFileSync("corpus/corpus.sha256","utf8").trim())throw Error("corpus checksum");'
          export BENCH_POSITIONS=20000 BENCH_GAMES=300 BENCH_RUNS=15 BENCH_WARMUPS=8 BENCH_OUT=../benchmark-results/paired
          node legality.mjs 2>&1 | tee ../benchmark-results/legality.log
          if [ "${{ matrix.runtime }}" = bun ]; then
            bun paired.mjs baseline candidate 2>&1 | tee ../benchmark-results/paired.log
          else
            node --expose-gc paired.mjs baseline candidate 2>&1 | tee ../benchmark-results/paired.log
          fi
      - name: Paired cold and loaded sliding attacks
        if: matrix.variant != 'targetcontrol'
        run: |
          set -o pipefail
          cd ci-phase12
          export BENCH_WARMUPS=8 BENCH_RUNS=15
          if [ "${{ matrix.runtime }}" = bun ]; then
            bun slider-paired.mjs 2>&1 | tee ../benchmark-results/sliders.log
          else
            node --expose-gc slider-paired.mjs 2>&1 | tee ../benchmark-results/sliders.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase12-${{ matrix.variant }}-${{ matrix.runner }}-${{ matrix.runtime }}
          path: benchmark-results/
          retention-days: 30
