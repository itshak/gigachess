name: bench-real
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci
      - run: node bench/matrix/prepare-corpus.mjs 20000 1000
      - uses: actions/upload-artifact@v4
        with:
          name: phase15-corpus
          path: |
            ci-benchmark/corpus.json
            ci-benchmark/corpus.sha256
  validate:
    needs: corpus
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {runner: ubuntu-24.04, node: '24.19.0'}
          - {runner: ubuntu-24.04-arm, node: '24.19.0'}
          - {runner: windows-2025, node: '24.19.0'}
          - {runner: windows-11-arm, node: '24.19.0'}
          - {runner: ubuntu-24.04, node: '22.5.0'}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: phase15-corpus
          path: ci-benchmark
      - name: Build exact candidate and pinned competitors
        run: bash bench/matrix/setup.sh
      - name: Full correctness and reproducible tables
        run: |
          set -euo pipefail
          npm run typecheck
          npm test 2>&1 | tee benchmark-results/correctness.log
          node bench/make-split32-tables.mjs
          git diff --exit-code -- src/rookSplit32Blob.ts src/bishopSplit32Blob.ts
      - name: Direct comparison (mixed-engine)
        run: |
          set -o pipefail
          node --expose-gc --import ./ci-benchmark/tools/node_modules/tsx/dist/loader.mjs bench/bench-competitive-movegen-direct.mjs --baseline ci-benchmark/baseline/dist/fast/index.js --drumevp ci-benchmark/drumevp --published ci-benchmark/package/dist/index.js --warmups 12 --runs 25 | tee benchmark-results/direct-movegen.json
      - name: Isolated native generation and complete lifecycle
        run: |
          set -euo pipefail
          node bench/phase15/isolated.mjs
          ISOLATED_MODE=lifecycle node bench/phase15/isolated.mjs
      - name: Paired Phase 8 regression and expanded legality
        run: |
          set -euo pipefail
          mkdir -p ci-benchmark/corpus ci-benchmark/candidate
          cp ci-benchmark/corpus.json ci-benchmark/corpus/
          cp bench/phase15/{paired,legality}.mjs ci-benchmark/
          cp -R dist ci-benchmark/candidate/dist
          cd ci-benchmark
          node legality.mjs 2>&1 | tee ../benchmark-results/legality.log
          export BENCH_POSITIONS=20000 BENCH_GAMES=300 BENCH_RUNS=15 BENCH_WARMUPS=8 BENCH_OUT=../benchmark-results/paired
          node --expose-gc paired.mjs baseline candidate 2>&1 | tee ../benchmark-results/paired.log
      - name: Real-game all-library comparison
        run: |
          set -o pipefail
          node --expose-gc bench/matrix/cli.mjs --no-deep --runs 9 --warmups 5 --games 300 2>&1 | tee benchmark-results/matrix.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase15-${{ matrix.runner }}-${{ matrix.node }}
          path: benchmark-results/
