name: bench-real
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci
      - run: node bench/matrix/prepare-corpus.mjs 20000 1000
      - uses: actions/upload-artifact@v4
        with:
          name: phase18-corpus
          path: |
            ci-benchmark/corpus.json
            ci-benchmark/corpus.sha256
  diagnose:
    needs: corpus
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        variant: [rays, between, shared, geocopy, lean]
        runner: [ubuntu-24.04, windows-11-arm]
        node: ['24.19.0']
        include:
          - {variant: shared, runner: ubuntu-24.04-arm, node: '24.19.0'}
          - {variant: shared, runner: windows-2025, node: '24.19.0'}
          - {variant: lean, runner: ubuntu-24.04-arm, node: '24.19.0'}
          - {variant: lean, runner: windows-2025, node: '24.19.0'}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: phase18-corpus
          path: ci-benchmark
      - name: Build isolated candidate and pinned references
        run: |
          git apply --check "bench/phase18/patches/${{ matrix.variant }}.patch"
          git apply "bench/phase18/patches/${{ matrix.variant }}.patch"
          bash bench/matrix/setup.sh
      - name: Correctness before timing
        run: |
          set -euo pipefail
          (node tests/move-list-ownership.mjs && node tests/pawn-list-order.mjs && node tests/split32-exhaustive.mjs --cold && node tests/split32-exhaustive.mjs && node tests/perft-specialized-parity.mjs && node tests/standard-movegen-differential.mjs) 2>&1 | tee benchmark-results/correctness.log
      - name: Reproduce original four-engine direct comparison
        run: |
          set -o pipefail
          node --expose-gc --import ./ci-benchmark/tools/node_modules/tsx/dist/loader.mjs bench/bench-competitive-movegen-direct.mjs --baseline ci-benchmark/baseline/dist/fast/index.js --drumevp ci-benchmark/drumevp --published ci-benchmark/package/dist/index.js --warmups 12 --runs 25 | tee benchmark-results/direct-movegen.json
      - name: Counterbalanced independent-process GC and call-site controls
        run: |
          set -o pipefail
          node bench/phase16/run.mjs 2>&1 | tee benchmark-results/callsite.log
      - name: Paired full real-game workloads
        run: |
          set -euo pipefail
          mkdir -p ci-benchmark/corpus ci-benchmark/candidate
          cp ci-benchmark/corpus.json ci-benchmark/corpus/
          cp bench/phase18/paired-long.mjs ci-benchmark/paired.mjs
          cp -R dist ci-benchmark/candidate/dist
          cd ci-benchmark
          export BENCH_POSITIONS=20000 BENCH_GAMES=300 BENCH_RUNS=15 BENCH_WARMUPS=8 BENCH_BATCHES=4 BENCH_OUT=../benchmark-results/paired
          node --expose-gc paired.mjs baseline candidate 2>&1 | tee ../benchmark-results/paired.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase18-${{ matrix.variant }}-${{ matrix.runner }}-${{ matrix.node }}
          path: benchmark-results/
