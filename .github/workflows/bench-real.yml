name: bench-real
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-bundle:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci && npm run build
      - run: |
          mkdir -p benchmark-results
          set -o pipefail
          node tests/maintenance-regression.mjs | tee benchmark-results/golden-vectors.log
          node --expose-gc bench/bench-real.mjs --suite bundle --json | tee benchmark-results/bundle.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-${{ matrix.runner }}
          path: benchmark-results/
