name: bench-real
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci
      - run: node bench/matrix/prepare-corpus.mjs 20000 1000
      - uses: actions/upload-artifact@v4
        with:
          name: phase9-corpus
          path: |
            ci-benchmark/corpus.json
            ci-benchmark/corpus.sha256
  experiment:
    needs: corpus
    name: ${{ matrix.variant }} / ${{ matrix.runner }} / ${{ matrix.runtime }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        variant: [fen, hash, attack, write, movegen, combined, replay, leaf, copy, leafcopy]
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
        runtime: [node24]
        include:
          - {variant: replay, runner: ubuntu-24.04, runtime: node22}
          - {variant: replay, runner: macos-15, runtime: node22}
          - {variant: replay, runner: macos-15, runtime: bun}
          - {variant: write, runner: macos-15, runtime: bun}
          - {variant: movegen, runner: macos-15, runtime: bun}
          - {variant: leafcopy, runner: macos-15, runtime: bun}
          - {variant: combined, runner: macos-15, runtime: bun}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.runtime == 'node22' && '22.5.0' || '24.19.0' }}
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
        with:
          bun-version: '1.4.0'
      - uses: actions/download-artifact@v4
        with:
          name: phase9-corpus
          path: ci-phase9/corpus
      - name: Build same-commit baseline and independent patch
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          node bench/matrix/machine.mjs
          git worktree add --detach ci-phase9/baseline 8a1a44a
          git worktree add --detach ci-phase9/candidate 8a1a44a
          git -C ci-phase9/candidate apply --check "../../bench/phase9/patches/${{ matrix.variant }}.patch"
          git -C ci-phase9/candidate apply "../../bench/phase9/patches/${{ matrix.variant }}.patch"
          (cd ci-phase9/baseline && npm ci && npm run build)
          (cd ci-phase9/candidate && npm ci && npm run build)
          cp bench/phase9/paired.mjs ci-phase9/paired.mjs
      - name: Correctness before timing
        run: |
          set -o pipefail
          cd ci-phase9/candidate
          (node tests/pawn-list-order.mjs && node tests/move-list-ownership.mjs && node tests/maintenance-regression.mjs && node tests/castling.mjs && node tests/zobrist-parity.mjs && node tests/perft-specialized-parity.mjs && node tests/perft-compact-differential.mjs && node tests/standard-movegen-differential.mjs && node tests/attacked-squares.mjs) 2>&1 | tee ../../benchmark-results/correctness.log
      - name: Paired real-corpus measurements
        run: |
          set -o pipefail
          cd ci-phase9
          node --input-type=module -e 'import fs from "node:fs";import crypto from "node:crypto";const h=crypto.createHash("sha256").update(fs.readFileSync("corpus/corpus.json")).digest("hex");if(h!==fs.readFileSync("corpus/corpus.sha256","utf8").trim())throw Error("corpus checksum");'
          export BENCH_POSITIONS=20000 BENCH_GAMES=300 BENCH_RUNS=15 BENCH_WARMUPS=8 BENCH_OUT=../benchmark-results/paired
          case "${{ matrix.variant }}" in
            leaf|copy|leafcopy|combined) ;;
            *) export BENCH_LANES=fen-parse,fen-write,fen-roundtrip,movegen-fresh,validated-replay,perft-mixed ;;
          esac
          if [ "${{ matrix.runtime }}" = bun ]; then
            bun paired.mjs baseline candidate 2>&1 | tee ../benchmark-results/paired.log
          else
            node --expose-gc paired.mjs baseline candidate 2>&1 | tee ../benchmark-results/paired.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase9-${{ matrix.variant }}-${{ matrix.runner }}-${{ matrix.runtime }}
          path: benchmark-results/
          retention-days: 30
