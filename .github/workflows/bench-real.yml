name: bench-real
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci
      - run: node bench/matrix/prepare-corpus.mjs 20000 1000
      - uses: actions/upload-artifact@v4
        with:
          name: phase16-corpus
          path: |
            ci-benchmark/corpus.json
            ci-benchmark/corpus.sha256
  diagnose:
    needs: corpus
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {runner: ubuntu-24.04, node: '24.19.0'}
          - {runner: ubuntu-24.04-arm, node: '24.19.0'}
          - {runner: windows-2025, node: '24.19.0'}
          - {runner: windows-11-arm, node: '24.19.0'}
          - {runner: ubuntu-24.04, node: '22.5.0'}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: phase16-corpus
          path: ci-benchmark
      - name: Build unchanged validated engine and pinned competitors
        run: bash bench/matrix/setup.sh
      - name: Reproduce original four-engine direct comparison
        run: |
          set -o pipefail
          node --expose-gc --import ./ci-benchmark/tools/node_modules/tsx/dist/loader.mjs bench/bench-competitive-movegen-direct.mjs --baseline ci-benchmark/baseline/dist/fast/index.js --drumevp ci-benchmark/drumevp --published ci-benchmark/package/dist/index.js --warmups 12 --runs 25 | tee benchmark-results/direct-movegen.json
      - name: Counterbalanced independent-process GC and call-site controls
        run: |
          set -o pipefail
          node bench/phase16/run.mjs 2>&1 | tee benchmark-results/callsite.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase16-${{ matrix.runner }}-${{ matrix.node }}
          path: benchmark-results/
