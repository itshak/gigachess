name: bench-real
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci
      - run: node bench/matrix/prepare-corpus.mjs 20000 1000
      - uses: actions/upload-artifact@v4
        with:
          name: phase20-corpus
          path: |
            ci-benchmark/corpus.json
            ci-benchmark/corpus.sha256
  diagnose:
    needs: corpus
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {runner: ubuntu-24.04, node: '24.19.0'}
          - {runner: ubuntu-24.04, node: '22.5.0'}
          - {runner: windows-11-arm, node: '24.19.0'}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: phase20-corpus
          path: ci-benchmark
      - name: Build identical Phase 15 engines and pinned competitors
        run: bash bench/matrix/setup.sh
      - name: Verify exact normalized real-game legal moves
        run: |
          set -o pipefail
          node bench/phase20/verify.mjs | tee benchmark-results/word-parity.json
      - name: Equal retention and allocation lifetime controls
        run: node bench/phase20/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase20-${{ matrix.runner }}-${{ matrix.node }}
          path: benchmark-results/
